<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <style>
      .green{fill:#0b6b3a}
      .gold{fill:#a88a18}
      .white{fill:#ffffff}
      .stroke{stroke:#0b6b3a;stroke-width:8}
      text{font-family:Arial,sans-serif}
    </style>
  </defs>

  <!-- Shield -->
  <path d="M200 120 L600 120 L600 420 C600 560 500 650 400 710 C300 650 200 560 200 420 Z"
        fill="#f5f5f5" stroke="#0b6b3a" stroke-width="12"/>

  <!-- Quadrants -->
  <path d="M200 120 L400 120 L400 415 L200 415 Z" class="gold"/>
  <path d="M400 120 L600 120 L600 415 L400 415 Z" class="green"/>
  <path d="M200 415 L400 415 L400 620 C320 580 250 520 200 430 Z" class="green"/>
  <path d="M400 415 L600 415 L600 430 C550 520 480 580 400 620 Z" class="gold"/>

  <!-- Book -->
  <path d="M270 210 h90 v60 h-90 q-20 0 -30 -15 v-45 q10 15 30 0z" class="white"/>
  <path d="M360 210 h90 v60 h-90 z" class="white"/>

  <!-- Torch -->
  <path d="M500 205 c25 25 20 55 0 80 c-20 -25 -25 -55 0 -80z" class="white"/>
  <rect x="490" y="280" width="20" height="60" class="white"/>

  <!-- Ball -->
  <circle cx="300" cy="500" r="45" class="white"/>
  <path d="M300 455 l20 15 -8 25 h-24 l-8 -25z" fill="#0b6b3a"/>

  <!-- Camera -->
  <rect x="455" y="470" width="100" height="65" rx="8" class="white"/>
  <circle cx="505" cy="502" r="18" fill="none" class="stroke"/>
  <rect x="470" y="450" width="35" height="20" class="white"/>

  <!-- Ribbon -->
  <path d="M150 360 L650 360 L610 420 L190 420 Z" fill="#0b6b3a"/>
  <rect x="240" y="345" width="320" height="45" fill="#f8f2d5"/>
  <text x="400" y="378" font-size="48" font-weight="bold" text-anchor="middle" fill="#0b6b3a">GCS</text>

  <!-- Laurels -->
  <path d="M120 250 C70 350 70 500 170 620" fill="none" class="stroke"/>
  <path d="M680 250 C730 350 730 500 630 620" fill="none" class="stroke"/>
</svg>